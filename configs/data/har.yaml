# UCI HAR, subject 2 (source) -> subject 11 (target).
name: har
npz_path: data/processed/har.npz
source_subject: 2
target_subject: 11
batch_size: 32
test_ratio: 0.2
seed: 42

n_channels: 9
n_steps: 128
n_classes: 6
sample_rate_hz: 50.0
class_names: [WALKING, WALKING_UPSTAIRS, WALKING_DOWNSTAIRS, SITTING, STANDING, LAYING]
