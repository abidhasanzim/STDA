[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-timeseries-domain-adaptation"
version = "0.1.0"
description = "Secure time-series domain adaptation: backdoor attacks and defenses for transfer learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abid Hasan" }]
keywords = [
  "time series",
  "backdoor attacks",
  "data poisoning",
  "domain adaptation",
  "transfer learning",
  "machine learning security",
  "pytorch",
]
dependencies = [
  "torch>=2.6",
  "numpy>=2.0",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.9"]
dashboard = ["streamlit>=1.30", "pandas>=2.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
backdoor-audit = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B905", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
